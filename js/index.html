<!doctype html>
<html lang="ja" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS辞典 | FRONTEND-DOCS</title>
  <meta name="description" content="HTMLタグ・CSSプロパティ・JavaScriptを、サンプルコードと実際の表示結果で学べる辞典・学習サイトです。">
  <script>
    // テーマをちらつき前に適用（保存値 → OS設定の順）
    (function () {
      var t; try { t = localStorage.getItem('hcg-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script type="module" src="../assets/js/main.js"></script>
</head>

</html>
